<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d1420"/>
  <!-- Blueprint grid (subtle) -->
  <g stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
  </g>
  <!-- Lightning bolt — the Quirky signature -->
  <path d="M296 48 L168 272 H248 L216 464 L344 240 H264 Z"
        fill="#f5a524"
        stroke="#ffb748"
        stroke-width="8"
        stroke-linejoin="round"/>
  <!-- Accent glow -->
  <path d="M296 48 L168 272 H248 L216 464 L344 240 H264 Z"
        fill="none"
        stroke="#f5a524"
        stroke-width="2"
        stroke-linejoin="round"
        opacity="0.4"
        transform="scale(1.06) translate(-15,-15)"/>
  <!-- Corner brackets — workshop/blueprint aesthetic -->
  <g stroke="#2dd4bf" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M48 96 V48 H96"/>
    <path d="M416 48 H464 V96"/>
    <path d="M464 416 V464 H416"/>
    <path d="M96 464 H48 V416"/>
  </g>
  <!-- Small code brackets -->
  <text x="256" y="400" text-anchor="middle" font-family="monospace" font-size="48" fill="#2dd4bf" opacity="0.6">&lt;/&gt;</text>
</svg>